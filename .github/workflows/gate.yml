name: adapter-gate

on:
  pull_request:
    paths:
      - "adapters/**"
      - "schema/**"
      - "tools/**"

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gate dependencies
        run: pip install -r tools/requirements.txt

      - name: Gate unit tests
        run: python -m pytest tools/ -q

      - name: Gate changed descriptors
        run: |
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'adapters/*/*.yaml' | tr '\n' ' ')
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(schema|tools)/'; then
            echo "Schema or tooling changed: gating the whole tree."
            python tools/gate/gate.py check --all
          elif [ -z "$CHANGED" ]; then
            echo "No descriptors changed."
          else
            # shellcheck disable=SC2086
            python tools/gate/gate.py check $CHANGED
          fi

      - name: Drift classification
        run: |
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'adapters/*/*.yaml' | tr '\n' ' ')
          for f in $CHANGED; do
            [ -f "$f" ] || continue
            echo "--- $f"
            python tools/gate/gate.py drift "$f" || true
          done

      - name: Secret-canary scan (fail closed)
        run: python tools/gate/gate.py scan-secrets

  label-drift:
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      pull-requests: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gate dependencies
        run: pip install -r tools/requirements.txt
      - name: Apply drift labels
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const base = context.payload.pull_request.base.ref;
            const files = execSync(
              `git diff --name-only origin/${base}...HEAD -- 'adapters/*/*.yaml'`,
              { encoding: 'utf8' }
            ).split('\n').filter(f => f.trim() && require('fs').existsSync(f.trim()));
            const { execFileSync } = require('child_process');
            const labels = new Set();
            for (const f of files) {
              try {
                const out = execFileSync('python', ['tools/gate/gate.py', 'drift', f.trim()], { encoding: 'utf8' });
                const drift = JSON.parse(out).drift;
                if (drift) labels.add(`drift:${drift}`);
              } catch { /* gate job reports failures; labels are advisory */ }
            }
            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: context.payload.pull_request.number,
                labels: [...labels],
              });
            }
